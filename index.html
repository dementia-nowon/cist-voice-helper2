<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12665f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="인지검사">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>인지검사 도우미 · 모바일 음성인식 보정</title>
  <style>
    :root{--p:#176b66;--p2:#238b82;--bg:#eef7f5;--card:#fff;--text:#173b38;--muted:#6a7f7c;--line:#dceae8}
    *{box-sizing:border-box}
    html{background:#dff0ed} body{margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#eaf6f4,#f8fbfb);color:var(--text)}
    button,select,input{font:inherit}
    .app{max-width:980px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column}
    .top{display:flex;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;backdrop-filter:blur(16px);align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:16px 20px;box-shadow:0 10px 30px rgba(23,107,102,.09)}
    .brand h1{margin:0;font-size:clamp(21px,3vw,31px)}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
    .pill{flex:none;background:#e4f2f0;color:var(--p);padding:9px 13px;border-radius:999px;font-weight:850}
    .settings{margin-top:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;align-items:end}
    .setting label{display:flex;justify-content:space-between;gap:10px;font-weight:850;margin-bottom:7px;color:var(--text)}
    .setting small{color:var(--p);font-weight:900}
    .setting select{width:100%;border:1px solid #cfe0dd;border-radius:13px;padding:11px;background:#fff;color:var(--text)}
    .setting input[type="range"]{width:100%;accent-color:var(--p)}
    .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0}
    .card{width:100%;min-height:480px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 38px rgba(23,107,102,.09);display:flex;flex-direction:column;justify-content:center;text-align:center}
    .eyebrow{color:var(--p);font-weight:850;margin-bottom:16px}
    .listen-icon{font-size:70px;line-height:1;margin-bottom:20px}
    .prompt{font-size:clamp(25px,4.5vw,43px);line-height:1.6;font-weight:850;word-break:keep-all}
    .hint{margin-top:20px;color:var(--muted);font-size:17px;line-height:1.6}
    .words{display:grid;gap:14px;max-width:680px;width:100%;margin:8px auto 0}
    .word{background:#edf7f5;border:2px solid #cfe5e1;border-radius:20px;padding:18px;font-size:clamp(27px,5vw,48px);font-weight:900;line-height:1.25}
    .figure-note{background:#f2f7f6;border:2px dashed #bad5d1;border-radius:22px;padding:36px 20px;font-size:clamp(23px,4vw,36px);font-weight:850;line-height:1.5}
    .timer{font-size:clamp(64px,13vw,118px);font-weight:950;letter-spacing:.04em;color:var(--p);line-height:1;margin:12px 0 28px}
    .timer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .recall-grid{display:grid;grid-template-columns:1fr;gap:12px;max-width:650px;margin:24px auto 0}
    .recall-btn{width:100%;font-size:18px;text-align:left;padding:17px 20px}
    .orientation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:680px;margin:24px auto 0}
    .orientation-grid button{width:100%;font-size:17px}
    .speech-monitor{margin-top:26px;padding:18px 20px;border:2px solid #cfe5e1;border-radius:20px;background:#f8fcfb;text-align:left}
    .speech-monitor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--p);font-weight:900}
    .speech-status{font-size:14px;background:#e4f2f0;padding:6px 10px;border-radius:999px}
    .speech-text{position:relative;font-size:clamp(22px,3.5vw,33px);line-height:2.15;font-weight:850;word-break:keep-all;max-height:260px;overflow:auto;scroll-behavior:auto;padding:30px 4px 8px}
    .speech-word{display:inline;white-space:pre-wrap;color:inherit}
    .speech-marker{position:absolute;z-index:2;width:10px;height:10px;border-radius:50%;background:var(--p);pointer-events:none;opacity:0;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(23,107,102,.22)}
    .karaoke-progress{display:none}
    .voice{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    button{border:0;min-height:52px;touch-action:manipulation;box-shadow:0 5px 14px rgba(23,107,102,.08);border-radius:17px;padding:15px 21px;font-weight:850;cursor:pointer}
    .primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
    .secondary{background:#eaf3f2;color:var(--p)}
    .nav{display:grid;z-index:10;margin-bottom:max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(16px);grid-template-columns:1fr 1fr;gap:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;padding:12px;position:sticky;bottom:8px}
    .nav button:disabled{opacity:.38;cursor:not-allowed}
    .install-banner{display:none;margin-top:12px;background:linear-gradient(135deg,#143f3b,#176b66);color:white;border-radius:20px;padding:15px 16px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 30px rgba(16,67,62,.2)}
    .install-banner.show{display:flex}.install-copy{font-weight:850;line-height:1.4}.install-copy small{display:block;opacity:.78;font-weight:650;margin-top:2px}.install-btn{background:white;color:#176b66;padding:11px 15px;min-height:44px;white-space:nowrap}
    .offline-badge{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:50;background:#173b38;color:white;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:850;box-shadow:0 8px 20px rgba(0,0,0,.18)}.offline-badge.show{display:block}
    @media(max-width:650px){.app{padding:9px}.settings{grid-template-columns:1fr;padding:13px}.setting{min-width:0}.top{padding:13px 15px;border-radius:18px}.brand p{display:none}.card{min-height:430px;padding:20px 16px;border-radius:22px}.listen-icon{font-size:58px}.voice{display:grid}.voice button{width:100%}.nav button{padding:13px 8px}.orientation-grid{grid-template-columns:1fr}}
  
/* 과일·채소 유창성 음성인식 */
.fluency-panel{margin:22px auto 0;max-width:820px;width:100%;text-align:left}
.fluency-status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fluency-status .mic-state{font-weight:900;padding:9px 13px;border-radius:999px;background:#e4f2f0;color:var(--p)}
.fluency-status .count{font-size:20px;font-weight:950;color:var(--p)}
.fluency-live{min-height:58px;padding:14px 16px;border:2px solid #cfe5e1;border-radius:16px;background:#fff;margin-bottom:12px;color:var(--muted);font-size:18px;line-height:1.5}
.fluency-words{display:flex;flex-wrap:wrap;gap:9px;min-height:52px;padding:14px;border:2px solid #cfe5e1;border-radius:16px;background:#f8fcfb}
.fluency-chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:#edf7f5;border:1px solid #cfe5e1;font-size:18px;font-weight:900}
.fluency-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.fluency-controls button{font-size:17px}
.fluency-help{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}
.fluency-manual{display:flex;gap:8px;margin-top:12px}
.fluency-manual input{flex:1;min-width:0;border:1px solid #cfe0dd;border-radius:13px;padding:12px;font-size:17px}
.fluency-error{color:#a33;font-weight:800}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>인지검사 도우미</h1>
      <p>모바일·태블릿용 음성 검사 진행 앱</p>
    </div>
    <div class="pill" id="pageCount">1 / 1</div>
  </header>
  <div class="install-banner" id="installBanner">
    <div class="install-copy">📱 앱으로 설치하기<small>홈 화면에서 전체화면으로 사용할 수 있습니다.</small></div>
    <button class="install-btn" id="installBtn">설치</button>
  </div>
  <div class="offline-badge" id="offlineBadge">오프라인 모드</div>
  <div id="secureBanner" style="display:none;margin-top:10px;background:#fff3cd;color:#6b4f00;border:1px solid #f0d98c;border-radius:16px;padding:12px 14px;font-weight:800;line-height:1.5">
    ⚠️ 현재 파일 직접 열기 방식입니다. 갤럭시탭에서 음성인식을 사용하려면 <b>HTTPS 웹주소</b>로 접속해야 합니다.
  </div>

  <section class="settings" id="voiceSettings" aria-label="음성 설정">
    <div class="setting">
      <label for="voiceSelect"><span>목소리</span><small id="voiceStatus">불러오는 중</small></label>
      <select id="voiceSelect" onchange="saveVoiceSettings()"><option value="">기본 한국어 음성</option></select>
    </div>
    <div class="setting">
      <label for="volumeRange"><span>음량</span><small id="volumeValue">100%</small></label>
      <input id="volumeRange" type="range" min="0" max="1" step="0.05" value="1" oninput="updateSettingLabels(); saveVoiceSettings()">
    </div>
    <div class="setting">
      <label for="rateRange"><span>말하기 속도</span><small id="rateValue">0.88배</small></label>
      <input id="rateRange" type="range" min="0.5" max="1.5" step="0.05" value="0.88" oninput="updateSettingLabels(); saveVoiceSettings()">
    </div>
    <div class="setting" style="grid-column:1/-1">
      <button class="primary" style="width:100%" onclick="testVoice()">🔊 음향 테스트</button>
    </div>
  </section>

  <main class="stage">
    <section class="card">
      <div class="eyebrow" id="title"></div>
      <div id="content"></div>
      <div class="speech-monitor" id="speechMonitor">
        <div class="speech-monitor-head"><span>📋 음성 진행 확인</span><span class="speech-status" id="speechStatus">대기</span></div>
        <div class="speech-text" id="speechText"></div>
      </div>
      <div class="voice" id="voiceArea">
        <button class="primary" onclick="speakCurrent()">🔊 음성 다시 듣기</button>
        <button class="secondary" onclick="stopVoice()">음성 중지</button>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="secondary" id="prevBtn" onclick="prevPage()">◀ 이전</button>
    <button class="primary" id="nextBtn" onclick="nextPage()">다음 ▶</button>
  </nav>
</div>

function updateSettingLabels(){
  $('volumeValue').textContent = `${Math.round(Number($('volumeRange').value) * 100)}%`;
  $('rateValue').textContent = `${Number($('rateRange').value).toFixed(2)}배`;
}

function saveVoiceSettings(){
  localStorage.setItem('cist-voice-settings', JSON.stringify({
    voice: $('voiceSelect').value,
    volume: $('volumeRange').value,
    rate: $('rateRange').value
  }));
}

function loadVoiceSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem('cist-voice-settings') || '{}');
    if(saved.volume != null) $('volumeRange').value = saved.volume;
    if(saved.rate != null) $('rateRange').value = saved.rate;
    $('voiceSelect').dataset.savedVoice = saved.voice || '';
  }catch(e){}
  updateSettingLabels();
}

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  availableVoices = speechSynthesis.getVoices();
  const korean = availableVoices.filter(v => /^ko(?:-|_)/i.test(v.lang));
  const list = korean.length ? korean : availableVoices;
  const select = $('voiceSelect');
  const saved = select.dataset.savedVoice || select.value;
  select.innerHTML = '<option value="">기본 한국어 음성</option>' + list.map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
  if([...select.options].some(o => o.value === saved)) select.value = saved;
  $('voiceStatus').textContent = korean.length ? `${korean.length}개` : '기기 음성';
}

function updateTimer(){
  const timer = $('timer');
  if(!timer) return;
  const minutes = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const seconds = String(timerSeconds % 60).padStart(2, '0');
  timer.textContent = `${minutes}:${seconds}`;
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

function isAndroidChrome(){
  const ua = navigator.userAgent || '';
  return /Android/i.test(ua) && /Chrome\//i.test(ua) && !/EdgA\//i.test(ua) && !/SamsungBrowser\//i.test(ua);
}

function fluencyBrowserInfo(){
  const secure = window.isSecureContext ? 'HTTPS 정상' : 'HTTPS 아님';
  const sr = (window.SpeechRecognition || window.webkitSpeechRecognition) ? '음성인식 지원' : '음성인식 미지원';
  return `${secure} · ${sr}`;
}

async function requestFluencyMic(){
  const live = $('fluencyLive');
  const mic = $('fluencyMicState');

  if(!window.isSecureContext){
    if(live) live.innerHTML = '🔒 <b>HTTPS 연결이 필요합니다.</b><br>GitHub Pages의 https:// 주소로 접속해 주세요.';
    if(mic) mic.textContent = '🔒 HTTPS 필요';
    return false;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(live) live.textContent = '이 브라우저에서는 마이크 접근 기능을 사용할 수 없습니다. Chrome 최신 버전으로 열어 주세요.';
    if(mic) mic.textContent = '⚠️ 마이크 미지원';
    return false;
  }

  try{
    stopFluencyMic();
    if(mic) mic.textContent = '🎤 권한 확인 중';
    if(live) live.textContent = 'Chrome의 마이크 사용 권한을 확인하고 있습니다.';

    // Android Chrome에서는 가장 단순한 audio:true 요청이 호환성이 좋습니다.
    const testStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const tracks = testStream.getAudioTracks();
    if(!tracks.length) throw new DOMException('사용 가능한 마이크 트랙이 없습니다.', 'NotFoundError');
    tracks.forEach(t => t.stop());

    // getUserMedia가 장치를 놓은 직후 SpeechRecognition이 마이크를 다시 잡을 시간을 줍니다.
    await sleep(350);
    fluencyMicReady = true;
    fluencyMicStream = null;

    if(mic) mic.textContent = '🟢 마이크 권한 정상';
    if(live) live.textContent = `🟢 마이크 권한이 확인되었습니다. (${fluencyBrowserInfo()})`;
    return true;
  }catch(err){
    fluencyMicReady = false;
    fluencyMicStream = null;
    const name = err?.name || 'UnknownError';
    let msg = '마이크 사용 권한을 허용해 주세요.';
    if(name === 'NotAllowedError' || name === 'PermissionDeniedError') msg = '마이크 권한이 차단되어 있습니다. Android 설정 → 앱 → Chrome → 권한 → 마이크를 허용하고, Chrome의 사이트 설정에서도 이 사이트의 마이크를 허용해 주세요.';
    else if(name === 'NotFoundError' || name === 'DevicesNotFoundError') msg = '사용할 수 있는 마이크를 찾지 못했습니다.';
    else if(name === 'NotReadableError' || name === 'TrackStartError') msg = '다른 앱이 마이크를 사용 중일 수 있습니다. 통화·녹음 앱을 종료한 뒤 다시 시도해 주세요.';
    else if(name === 'SecurityError') msg = '보안 정책 때문에 마이크에 접근할 수 없습니다. GitHub Pages의 HTTPS 주소로 열어 주세요.';
    if(live) live.innerHTML = '⚠️ <b>' + msg + '</b><br><small>오류: ' + name + '</small>';
    if(mic) mic.textContent = '⚠️ 마이크 권한 필요';
    return false;
  }
}

function stopFluencyMic(){
  if(fluencyMicStream){
    fluencyMicStream.getTracks().forEach(t=>t.stop());
    fluencyMicStream = null;
  }
  // Do not clear fluencyMicReady: this flag means the user has granted
  // microphone permission for this HTTPS page.
}

async function testFluencyMicrophone(){
  const ok=await requestFluencyMic();
  if(ok){
    setFluencyLive(`🟢 마이크 정상입니다. 이제 「1분 시작」을 눌러주세요. (${fluencyBrowserInfo()})`, '🟢 마이크 정상');
  }
  return ok;
}

const FLUENCY_VOCAB = FLUENCY_TERMS.map(t => t.word);
const FLUENCY_VOCAB_SET = new Set(FLUENCY_VOCAB);

function normalizeFluencyText(text){
  return String(text || '')
    .toLowerCase()
    .normalize('NFC')
    .replace(/[.,!?，。·:;()\[\]{}"'“”‘’\\\-_/]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderFluencyWords(){
  const box = $('fluencyWords');
  const count = $('fluencyCount');
  if(!box || !count) return;
  count.textContent = fluencyWords.size;
  if(!fluencyWords.size){
    box.innerHTML = '<span style="color:var(--muted)">인식된 과일·채소가 여기에 표시됩니다.</span>';
    return;
  }
  box.innerHTML = [...fluencyWords].map(w => `<span class="fluency-chip">${escapeHTML(w)}</span>`).join('');
}

function syncFluencyWords(){
  fluencyWords = new Set([...fluencyAutoWords, ...fluencyManualWords]);
  renderFluencyWords();
}

function addFluencyWord(word, source='auto'){
  const w = String(word || '').trim();
  if(!w || !FLUENCY_VOCAB_SET.has(w)) return false;
  const target = source === 'manual' ? fluencyManualWords : fluencyAutoWords;
  const before = target.size;
  target.add(w);
  if(target.size !== before) syncFluencyWords();
  return target.size !== before;
}

// 모든 길이의 후보를 먼저 수집한 다음 longest-match 단계에서 긴 단어가
// 짧은 단어를 덮도록 합니다. 한 글자 단어도 후보로 두어
// '사과배', '배사과', '사과배포도'처럼 붙여 말한 발화를 분리합니다.
function findFluencyOccurrences(normalized, alias){
  const a = normalizeFluencyText(alias);
  if(!a) return [];
  const hits = [];
  let from = 0;
  while(from < normalized.length){
    const idx = normalized.indexOf(a, from);
    if(idx < 0) break;
    hits.push({start:idx, end:idx+a.length, alias:a});
    from = idx + Math.max(1, a.length);
  }
  return hits;
}

// 가장 긴 단어부터 자리를 차지하게 하여 부분단어의 중복 오검출을 차단합니다.// 가장 긴 단어부터 자리를 차지하게 하여 부분단어의 중복 오검출을 차단합니다.
// 예: 콩나물→콩나물만, 완두콩→완두콩만, 양배추→양배추만,
//     애호박→애호박만, 방울토마토→방울토마토만 기록됩니다.
function analyzeFluencyTranscript(text){
  const normalized = normalizeFluencyText(text);
  if(!normalized) return {text:String(text||''), normalized:'', words:[], matchedChars:0};

  const candidates = [];
  FLUENCY_TERMS.forEach((term, termIndex) => {
    const aliases = [term.word, ...(term.aliases || [])];
    aliases.forEach(alias => {
      findFluencyOccurrences(normalized, alias).forEach(hit => {
        candidates.push({
          word:term.word,
          start:hit.start,
          end:hit.end,
          alias:hit.alias,
          matchLen:hit.alias.replace(/\s/g,'').length,
          termIndex
        });
      });
    });
  });

  candidates.sort((a,b) =>
    b.matchLen - a.matchLen ||
    (b.end-b.start) - (a.end-a.start) ||
    a.start - b.start ||
    a.termIndex - b.termIndex
  );

  const occupied = new Array(normalized.length).fill(false);
  const selected = [];
  const selectedWords = new Set();

  for(const c of candidates){
    let overlaps = false;
    for(let i=c.start; i<c.end; i++){
      if(occupied[i]){ overlaps = true; break; }
    }
    if(overlaps || selectedWords.has(c.word)) continue;
    for(let i=c.start; i<c.end; i++) occupied[i] = true;
    selectedWords.add(c.word);
    selected.push(c);
  }

  selected.sort((a,b)=>a.start-b.start || b.matchLen-a.matchLen);

  // '감사합니다'의 '감', '파란색'의 '파' 같은 한 글자 오검출은 막되,
  // '사과배'처럼 다른 정상 과일·채소와 바로 붙어 말한 한 글자 단어는 인정합니다.
  const filtered = selected.filter((item, idx, arr) => {
    if(item.matchLen !== 1) return true;
    const leftBoundary = item.start === 0 || /\s/.test(normalized[item.start-1] || '');
    const rightBoundary = item.end === normalized.length || /\s/.test(normalized[item.end] || '');
    if(leftBoundary && rightBoundary) return true;
    const prev = arr[idx-1];
    const next = arr[idx+1];
    const touchesPrev = !!prev && prev.end === item.start;
    const touchesNext = !!next && item.end === next.start;
    return touchesPrev || touchesNext;
  });

  return {
    text:String(text || '').trim(),
    normalized,
    words:filtered.map(x=>x.word),
    matchedChars:filtered.reduce((sum,x)=>sum+x.matchLen,0)
  };
}

function extractFluencyWords(text){
  const analysis = analyzeFluencyTranscript(text);
  analysis.words.forEach(w=>addFluencyWord(w, 'auto'));
  return analysis;
}

function rebuildAutoFluencyWords(){
  const analysis = analyzeFluencyTranscript(fluencyFinalText);
  fluencyAutoWords = new Set(analysis.words);
  syncFluencyWords();
  return analysis;
}

// SpeechRecognition의 여러 후보를 모두 합치면 오인식 단어까지 추가될 수 있으므로// SpeechRecognition의 여러 후보를 모두 합치면 오인식 단어까지 추가될 수 있으므로
// 후보별로 분석한 뒤 과일·채소를 가장 설득력 있게 잡은 한 후보만 채점합니다.
function chooseBestFluencyAlternative(result){
  const analyses = [];
  const limit = Math.min(3, result?.length || 0);
  for(let j=0; j<limit; j++){
    const alt = result[j];
    const analysis = analyzeFluencyTranscript(alt?.transcript || '');
    const confidence = Number.isFinite(Number(alt?.confidence)) ? Number(alt.confidence) : 0;
    analyses.push({...analysis, confidence, alternativeIndex:j});
  }
  if(!analyses.length) return analyzeFluencyTranscript('');

  analyses.sort((a,b) =>
    b.words.length - a.words.length ||
    b.matchedChars - a.matchedChars ||
    b.confidence - a.confidence ||
    a.alternativeIndex - b.alternativeIndex
  );
  return analyses[0];
}

function setFluencyLive(text, state){
  const live = $('fluencyLive');
  const mic = $('fluencyMicState');
  if(live && text) live.textContent = text;
  if(mic) mic.textContent = state;
}

function createFluencyRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'ko-KR';
  // 연속 발화를 한 세션에서 계속 받습니다. 매 단어마다 인식 세션을
  // 재시작하면 Android/Chrome에서 시스템 효과음이 반복되고 발화가 잘릴 수 있습니다.
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 3;

  r.onstart = () => {
    fluencyListening = true;
    setFluencyLive('🗣️ 음성인식이 시작되었습니다. 과일이나 채소를 말씀해 주세요.', '🟢 듣는 중');
  };

  r.onresult = (event) => {
    let interim = '';
    const acceptedFinals = [];

    for(let i=event.resultIndex; i<event.results.length; i++){
      const result = event.results[i];
      if(result.isFinal){
        const chosen = chooseBestFluencyAlternative(result);
        if(chosen.text) acceptedFinals.push(chosen.text);
      } else {
        interim += (result[0]?.transcript || '') + ' ';
      }
    }

    let finalText = acceptedFinals.join(' ').trim();
    if(finalText && fluencyInterimText){
      // Android 음성인식이 interim에서는 '콩나물'/'사과배'까지 들었다가
      // final에서 '콩'/'사과'처럼 뒤를 잘라 확정하는 경우를 보정합니다.
      const prev = analyzeFluencyTranscript(fluencyInterimText);
      const fin = analyzeFluencyTranscript(finalText);
      const prevCompact = prev.normalized.replace(/\s+/g,'');
      const finCompact = fin.normalized.replace(/\s+/g,'');
      const isSafePrefixRescue = finCompact && prevCompact.startsWith(finCompact) &&
        prevCompact.length > finCompact.length && prevCompact.length - finCompact.length <= 5 &&
        prev.matchedChars > fin.matchedChars && prev.words.length >= fin.words.length;
      if(isSafePrefixRescue) finalText = fluencyInterimText;
    }

    if(finalText){
      fluencyFinalText = (fluencyFinalText + ' ' + finalText).replace(/\s+/g,' ').trim();
      // 전체 누적 발화를 매번 다시 분석합니다.
      // 예: 첫 결과 '콩' + 다음 결과 '나물' => 기존 콩을 제거하고 콩나물로 교체.
      rebuildAutoFluencyWords();
    }

    fluencyInterimText = interim.trim();
    const previewText = [fluencyFinalText, fluencyInterimText].filter(Boolean).join(' ');
    const preview = analyzeFluencyTranscript(previewText);

    const live = $('fluencyLive');
    if(live){
      if(fluencyInterimText){
        live.textContent = '인식 중: ' + fluencyInterimText + (preview.words.length ? `  → ${preview.words.join(', ')}` : '');
      } else if(finalText){
        live.textContent = '최근 인식: ' + finalText;
      }
    }
    const raw = $('fluencyRawText');
    if(raw && (fluencyInterimText || finalText)){
      raw.textContent = '📝 누적 음성인식 원문: ' + previewText;
    }
  };

  r.onerror = (event) => {
    const code = event.error || 'unknown';
    fluencyListening = false;
    const messages = {
      'not-allowed':'음성인식 사용이 차단되었습니다. Chrome의 마이크 권한을 허용해 주세요.',
      'service-not-allowed':'Chrome의 음성인식 서비스가 허용되지 않았습니다. Chrome 최신 버전에서 다시 시도해 주세요.',
      'network':'Google 음성인식 서버 연결에 실패했습니다. Wi‑Fi/모바일 데이터 연결을 확인해 주세요.',
      'no-speech':'음성이 감지되지 않았습니다. 계속 듣기를 다시 시작합니다.',
      'audio-capture':'마이크를 사용할 수 없습니다. 다른 녹음/통화 앱을 종료해 주세요.',
      'language-not-supported':'한국어 음성인식을 지원하지 않습니다.',
      'aborted':'음성인식이 중단되었습니다.'
    };
    if(code !== 'no-speech' && code !== 'aborted'){
      setFluencyLive('⚠️ ' + (messages[code] || ('음성인식 오류: ' + code)), '⚠️ ' + code);
    }
  };

  r.onend = () => {
    fluencyListening = false;
    if(fluencyStopping) return;
    if(timerInterval && timerSeconds > 0){
      clearTimeout(fluencyRestartTimer);
      fluencyRestartTimer = setTimeout(() => {
        if(timerInterval && timerSeconds > 0 && !fluencyStopping){
          try { r.start(); } catch(e) {
            setFluencyLive('음성인식을 다시 시작하는 중입니다…', '🟡 재연결 중');
          }
        }
      }, 600);
    } else {
      setFluencyLive('음성인식이 종료되었습니다.', '⏹ 종료');
    }
  };
  return r;
}

function startFluencyRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setFluencyLive('이 브라우저에서는 웹 음성인식을 지원하지 않습니다. 갤럭시탭에서는 Samsung Internet이 아니라 Chrome 최신 버전으로 열어 주세요.', '⚠️ 음성인식 미지원');
    return false;
  }

  fluencyStopping = false;
  clearTimeout(fluencyRestartTimer);
  if(fluencyRecognition){
    try { fluencyRecognition.abort(); } catch(e) {}
  }
  fluencyRecognition = createFluencyRecognition();

  try{
    fluencyRecognition.start();
    return true;
  }catch(e){
    setFluencyLive('음성인식 시작 실패: ' + (e.message || e.name || '알 수 없는 오류'), '⚠️ 시작 실패');
    return false;
  }
}

function stopFluencyRecognition(){
  fluencyStopping = true;
  clearTimeout(fluencyRestartTimer);
  fluencyRestartTimer = null;
  if(fluencyRecognition){
    try { fluencyRecognition.abort(); } catch(e) {
      try { fluencyRecognition.stop(); } catch(_) {}
    }
  }
  fluencyListening = false;
}

function resetFluencyData(){
  fluencyWords = new Set();
  fluencyAutoWords = new Set();
  fluencyManualWords = new Set();
  fluencyFinalText = '';
  fluencyInterimText = '';
  const input = $('fluencyManualInput');
  if(input) input.value = '';
  renderFluencyWords();
  setFluencyLive('1분 시작을 누르면 어르신의 말씀을 인식합니다.', '🎤 대기 중');
}

function addManualFluencyWord(){
  const input = $('fluencyManualInput');
  if(!input) return;
  const value = input.value.trim();
  if(!value) return;

  // 직접 추가는 자동인식 재분석과 분리해 보존합니다.
  value.split(/\s+/).forEach(w => {
    if(w.length <= 20) fluencyManualWords.add(w);
  });
  input.value = '';
  syncFluencyWords();
}

/* 기존 타이머에 음성인식을 연결 *//* 기존 타이머에 음성인식을 연결 */
async function startTimer(){
  // 버튼을 누른 사용자 제스처 안에서 권한을 요청해야 Android Chrome에서 가장 안정적입니다.
  if('speechSynthesis' in window) speechSynthesis.cancel();

  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }

  if(!window.isSecureContext){
    setFluencyLive('🔒 GitHub Pages의 https:// 주소로 접속해야 마이크를 사용할 수 있습니다.', '🔒 HTTPS 필요');
    return;
  }

  // 별도의 마이크 테스트를 하지 않아도 1분 시작에서 바로 권한을 요청합니다.
  if(!fluencyMicReady){
    const allowed = await requestFluencyMic();
    if(!allowed) return;
  } else {
    // 이전 세션에서 권한이 확인된 경우에도 장치가 완전히 해제될 시간을 조금 줍니다.
    stopFluencyMic();
    await sleep(180);
  }

  timerSeconds=60;
  updateTimer();
  resetFluencyData();
  setFluencyLive('🎤 음성인식을 준비하고 있습니다…', '🟡 시작 중');

  const recognitionOK=startFluencyRecognition();
  if(!recognitionOK) return;

  timerInterval=setInterval(()=>{
    timerSeconds--;
    updateTimer();
    if(timerSeconds<=0){
      stopTimer();
      setFluencyLive('1분 검사가 끝났습니다. 검사 결과를 확인해 주세요.', '✅ 검사 종료');
      speakText('그만하세요. 1분이 끝났습니다.');
    }
  },1000);
}

function stopTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
  stopFluencyRecognition();
  stopFluencyMic();
}

function resetTimer(){
  stopTimer();
  timerSeconds = 60;
  updateTimer();
  resetFluencyData();
}

function testVoice(){ speakText(pages[0].speech); }

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function speechTokens(text){
  const tokens=[];
  const re=/\S+|\s+/g;
  let match;
  while((match=re.exec(text))){
    tokens.push({text:match[0],start:match.index,end:match.index+match[0].length,isSpace:/^\s+$/.test(match[0])});
  }
  return tokens;
}

function renderSpeechWords(text){
  const target=$('speechText');
  if(!target) return;
  const tokens=speechTokens(text || '');
  target.innerHTML='<span class="speech-marker" id="speechMarker" aria-hidden="true"></span>' + tokens.map((t,i)=>
    t.isSpace ? escapeHTML(t.text) : `<span class="speech-word" data-start="${t.start}" data-end="${t.end}" data-word="${i}">${escapeHTML(t.text)}</span>`
  ).join('');
}

function hideSpeechMarker(){
  markerEpoch++;
  markerVisible=false;
  lastMarkerWord=null;
  currentMarkerCharIndex=-1;
  const marker=$('speechMarker');
  if(marker){
    marker.style.opacity='0';
    marker.style.left='-9999px';
    marker.style.top='-9999px';
  }
}

function moveSpeechMarker(charIndex){
  const target=$('speechText');
  const marker=$('speechMarker');
  if(!target || !marker) return;
  const words=[...target.querySelectorAll('.speech-word')];
  if(!words.length) return;
  let word=words.find(el=>charIndex>=Number(el.dataset.start) && charIndex<Number(el.dataset.end));
  if(!word) word=words.find(el=>Number(el.dataset.start)>=charIndex) || words[words.length-1];

  if(word!==lastMarkerWord){
    const wordTop=word.offsetTop;
    const wordBottom=wordTop+word.offsetHeight;
    const visibleTop=target.scrollTop;
    const visibleBottom=visibleTop+target.clientHeight;
    if(wordTop<visibleTop+40 || wordBottom>visibleBottom-18){
      target.scrollTop=Math.max(0,wordTop-target.clientHeight*.45);
    }
    lastMarkerWord=word;
  }

  const epoch=markerEpoch;
  requestAnimationFrame(()=>{
    if(epoch!==markerEpoch) return;
    const liveMarker=$('speechMarker');
    if(!liveMarker || liveMarker!==marker) return;
    const host=target.getBoundingClientRect();
    const box=word.getBoundingClientRect();
    const x=box.left-host.left+target.scrollLeft+box.width/2;
    const y=box.top-host.top+target.scrollTop-12;
    marker.style.left=`${x}px`;
    marker.style.top=`${y}px`;
    marker.style.opacity='1';
    markerVisible=true;
  });
}
function setSpeechMonitor(text, index=-1, length=0, status='대기'){
  const nextText=text || '';
  const target=$('speechText');
  if(!target) return;
  $('speechStatus').textContent=status;
  if(activeSpeechText!==nextText || !target.querySelector('.speech-word')){
    activeSpeechText=nextText;
    lastMarkerWord=null;
    target.scrollTop=0;
    renderSpeechWords(nextText || '재생할 문장이 없습니다.');
    markerVisible=false;
  }
  if(index>=0 && nextText) moveSpeechMarker(index);
}

function stopKaraokeFallback(){
  if(karaokeInterval){
    clearInterval(karaokeInterval);
    karaokeInterval = null;
  }
}

function startKaraokeFallback(text, runId){
  stopKaraokeFallback();
  karaokeStartedAt = performance.now() - 140;
  const rate = Math.max(.5, Number($('rateRange').value) || .88);
  const words=speechTokens(text).filter(t=>!t.isSpace);
  const weights=words.map(w=>{
    const clean=w.text.replace(/[.,!?，。]/g,'');
    return Math.max(1, clean.length) + (/[.,!?，。]$/.test(w.text) ? 1.1 : 0);
  });
  const totalWeight=weights.reduce((a,b)=>a+b,0)||1;
  karaokeEstimatedMs=Math.max(850,(totalWeight/(7.2*rate))*1000);
  let currentWord=-1;
  karaokeInterval=setInterval(()=>{
    if(runId!==speechRunId || !activeUtterance) return stopKaraokeFallback();
    const ratio=Math.min(.995,(performance.now()-karaokeStartedAt)/karaokeEstimatedMs);
    let target=ratio*totalWeight, sum=0, idx=0;
    for(;idx<weights.length;idx++){ sum+=weights[idx]; if(sum>=target) break; }
    idx=Math.min(idx,words.length-1);
    if(idx!==currentWord && words[idx]){
      currentWord=idx;
      currentMarkerCharIndex=Math.max(currentMarkerCharIndex, words[idx].start);
      $('speechStatus').textContent='읽는 중';
      moveSpeechMarker(currentMarkerCharIndex);
    }
  },70);
}
function isAttentionNumberPage(){
  return pages[current] && (pages[current].title === '주의력 · 숫자 1' || pages[current].title === '주의력 · 숫자 2');
}

function primeBluetoothAudio(callback, requestId){
  // Bluetooth devices can clip the first syllable while their audio path wakes up.
  // Send a short silent utterance first, then start the real prompt.
  const warmup = new SpeechSynthesisUtterance(' ');
  warmup.lang = 'ko-KR';
  warmup.volume = 0.01;
  warmup.rate = 1;
  const selected = availableVoices.find(v => v.voiceURI === $('voiceSelect').value);
  if(selected){ warmup.voice = selected; warmup.lang = selected.lang; }
  let done=false;
  const finish=()=>{
    if(done) return;
    done=true;
    if(bluetoothPrimeTimer){ clearTimeout(bluetoothPrimeTimer); bluetoothPrimeTimer=null; }
    bluetoothPrimeTimer=setTimeout(()=>{
      bluetoothPrimeTimer=null;
      if(requestId !== speechRunId) return;
      callback();
    },180);
  };
  warmup.onend=finish;
  warmup.onerror=finish;
  speechSynthesis.speak(warmup);
  bluetoothPrimeTimer=setTimeout(finish,320);
}

function speakText(text, replaceMonitor=true, skipBluetoothPrime=false){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 읽기 기능을 지원하지 않습니다.');
    return;
  }
  stopVoice();
  if(!skipBluetoothPrime){
    const requestId=speechRunId;
    if(replaceMonitor) setSpeechMonitor(text, -1, 0, '재생 준비');
    primeBluetoothAudio(() => speakText(text, replaceMonitor, true), requestId);
    return;
  }
  const runId=++speechRunId;
  if(replaceMonitor) setSpeechMonitor(text, -1, 0, '재생 준비');
  const utterance = new SpeechSynthesisUtterance(text);
  activeUtterance = utterance;
  currentMarkerCharIndex=-1;
  utterance.lang = 'ko-KR';
  utterance.volume = isAttentionNumberPage() ? 1 : Number($('volumeRange').value);
  utterance.rate = Number($('rateRange').value);
  utterance.pitch = 1;
  const selected = availableVoices.find(v => v.voiceURI === $('voiceSelect').value);
  if(selected){ utterance.voice = selected; utterance.lang = selected.lang; }
  utterance.onstart = () => {
    if(runId!==speechRunId) return;
    lastBoundaryIndex = -1;
    $('speechStatus').textContent='읽는 중';
    currentMarkerCharIndex=0;
    moveSpeechMarker(0);
    startKaraokeFallback(text, runId);
  };
  utterance.onboundary = event => {
    if(runId!==speechRunId) return;
    if(typeof event.charIndex === 'number'){
      lastBoundaryIndex = event.charIndex;
      const elapsedEstimate=Math.floor(Math.max(0, performance.now()-karaokeStartedAt) / Math.max(1,karaokeEstimatedMs) * text.length);
      currentMarkerCharIndex=Math.max(currentMarkerCharIndex, event.charIndex, elapsedEstimate-1);
      $('speechStatus').textContent='읽는 중';
      moveSpeechMarker(Math.min(text.length-1,currentMarkerCharIndex));
    }
  };
  utterance.onend = () => {
    if(runId!==speechRunId) return;
    stopKaraokeFallback();
    hideSpeechMarker();
    $('speechStatus').textContent = '완료';
    activeUtterance = null;
    requestAnimationFrame(hideSpeechMarker);
  };
  utterance.onerror = event => {
    if(runId!==speechRunId) return;
    stopKaraokeFallback();
    hideSpeechMarker();
    if(event.error !== 'canceled' && event.error !== 'interrupted') setSpeechMonitor(text, -1, 0, '재생 오류');
    activeUtterance = null;
  };
  speechSynthesis.speak(utterance);
}
function speakAttentionSequence(items, fullText, primed=false){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 읽기 기능을 지원하지 않습니다.');
    return;
  }
  if(!primed){
    stopVoice();
    const requestId=speechRunId;
    setSpeechMonitor(fullText, -1, 0, '재생 준비');
    primeBluetoothAudio(() => speakAttentionSequence(items, fullText, true), requestId);
    return;
  }
  const runId=++speechRunId;
  // 숫자/낱말을 각각 끊어 재생하지 않고 한 번의 TTS로 연속 재생해
  // 음량·속도·음높이와 리듬이 일정하게 들리도록 합니다.
  const utterance=new SpeechSynthesisUtterance(fullText);
  activeUtterance=utterance;
  currentMarkerCharIndex=-1;
  utterance.lang='ko-KR';
  utterance.volume=1;
  utterance.rate=1.0;
  utterance.pitch=1.0;
  const selected=availableVoices.find(v=>v.voiceURI===$('voiceSelect').value);
  if(selected){ utterance.voice=selected; utterance.lang=selected.lang; }
  utterance.onstart=()=>{
    if(runId!==speechRunId) return;
    lastBoundaryIndex=-1;
    $('speechStatus').textContent='읽는 중';
    currentMarkerCharIndex=0;
    moveSpeechMarker(0);
    startKaraokeFallback(fullText, runId);
  };
  utterance.onboundary=event=>{
    if(runId!==speechRunId) return;
    if(typeof event.charIndex==='number'){
      lastBoundaryIndex=event.charIndex;
      currentMarkerCharIndex=Math.max(currentMarkerCharIndex,event.charIndex);
      moveSpeechMarker(Math.min(fullText.length-1,currentMarkerCharIndex));
    }
  };
  utterance.onend=()=>{
    if(runId!==speechRunId) return;
    stopKaraokeFallback();
    hideSpeechMarker();
    $('speechStatus').textContent='완료';
    activeUtterance=null;
  };
  utterance.onerror=event=>{
    if(runId!==speechRunId) return;
    stopKaraokeFallback();
    hideSpeechMarker();
    if(event.error!=='canceled' && event.error!=='interrupted') $('speechStatus').textContent='재생 오류';
    activeUtterance=null;
  };
  speechSynthesis.speak(utterance);
}

function playRecordedAudio(title, monitorText){
  const src=recordedAudioMap[title];
  if(!src) return false;
  stopVoice();
  setSpeechMonitor(monitorText, -1, 0, '재생 준비');
  const audio=new Audio(src);
  activeAudio=audio;
  audio.preload='auto';
  audio.volume=1;
  const spokenEndSecondsMap={
    '주의력 · 숫자 1':2.40,
    '주의력 · 숫자 2':2.90,
    '주의력 · 낱말':2.64
  };
  let recordedMarkerRaf=null;
  const updateRecordedMarker=()=>{
    if(activeAudio!==audio || !monitorText) return;
    const spokenEnd=spokenEndSecondsMap[title] || (Number.isFinite(audio.duration) ? audio.duration : 0);
    if(spokenEnd>0){
      const ratio=Math.max(0,Math.min(1,audio.currentTime/spokenEnd));
      if(ratio>=1){
        currentMarkerCharIndex=monitorText.length-1;
        hideSpeechMarker();
        $('speechStatus').textContent='완료';
        recordedMarkerRaf=null;
        return;
      }
      currentMarkerCharIndex=Math.min(monitorText.length-1,Math.floor(ratio*monitorText.length));
      moveSpeechMarker(currentMarkerCharIndex);
    }
    recordedMarkerRaf=requestAnimationFrame(updateRecordedMarker);
  };
  audio.onplay=()=>{
    if(activeAudio!==audio) return;
    $('speechStatus').textContent='읽는 중';
    currentMarkerCharIndex=0;
    moveSpeechMarker(0);
    if(recordedMarkerRaf) cancelAnimationFrame(recordedMarkerRaf);
    recordedMarkerRaf=requestAnimationFrame(updateRecordedMarker);
  };
  audio.ontimeupdate=null;
  audio.onended=()=>{
    if(recordedMarkerRaf){ cancelAnimationFrame(recordedMarkerRaf); recordedMarkerRaf=null; }
    if(activeAudio!==audio) return;
    hideSpeechMarker();
    $('speechStatus').textContent='완료';
    activeAudio=null;
  };
  audio.onerror=()=>{
    if(recordedMarkerRaf){ cancelAnimationFrame(recordedMarkerRaf); recordedMarkerRaf=null; }
    if(activeAudio!==audio) return;
    activeAudio=null;
    $('speechStatus').textContent='녹음 재생 오류';
    // 녹음 재생이 실패한 경우에만 기존 TTS로 대체합니다.
    speakText(monitorText);
  };
  const promise=audio.play();
  if(promise && typeof promise.catch==='function'){
    promise.catch(()=>{
      if(activeAudio!==audio) return;
      activeAudio=null;
      $('speechStatus').textContent='재생 버튼을 눌러 주세요';
    });
  }
  return true;
}

function speakCurrent(){
  const page=pages[current];
  if(!page) return;
  if(recordedAudioMap[page.title]){
    playRecordedAudio(page.title, page.speech);
    return;
  }
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 읽기 기능을 지원하지 않습니다.');
    return;
  }
  speakText(page.speech);
}

function stopVoice(){
  const wasActive=!!activeUtterance || !!activeAudio;
  speechRunId++;
  if(autoSpeakTimer){ clearTimeout(autoSpeakTimer); autoSpeakTimer=null; }
  if(bluetoothPrimeTimer){ clearTimeout(bluetoothPrimeTimer); bluetoothPrimeTimer=null; }
  stopKaraokeFallback();
  hideSpeechMarker();
  if(activeAudio){
    try{ activeAudio.pause(); activeAudio.currentTime=0; }catch(e){}
    activeAudio.onplay=null;
    activeAudio.ontimeupdate=null;
    activeAudio.onended=null;
    activeAudio.onerror=null;
    activeAudio=null;
  }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(wasActive && $('speechStatus')) $('speechStatus').textContent = '중지';
  activeUtterance = null;
  if(pages[current] && pages[current].mode === 'timer' && !timerInterval) { stopFluencyRecognition(); stopFluencyMic(); }
  requestAnimationFrame(hideSpeechMarker);
}

function prevPage(){
  if(current > 0){current--; render(false);}
}

function nextPage(){
  if(current < pages.length - 1){current++; render();}
  else {current = 0; render();}
}


let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  $('installBanner').classList.add('show');
});
$('installBtn').addEventListener('click', async () => {
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  $('installBanner').classList.remove('show');
});
window.addEventListener('appinstalled', () => $('installBanner').classList.remove('show'));
function updateNetworkState(){ $('offlineBadge').classList.toggle('show', !navigator.onLine); }
window.addEventListener('online', updateNetworkState);
window.addEventListener('offline', updateNetworkState);
updateNetworkState();
// GitHub Pages에서 이전 service worker가 오래된 index.html을 캐시하면
// 수정한 음성인식 코드가 태블릿에 반영되지 않을 수 있습니다.
// 이 버전은 온라인 사용을 우선하여 기존 등록을 해제합니다.
if('serviceWorker' in navigator){
  window.addEventListener('load', async () => {
    try{
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        if(reg.scope && location.href.startsWith(reg.scope)) await reg.unregister();
      }
    }catch(e){}
  });
}

loadVoiceSettings();
loadVoices();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;
window.addEventListener('beforeunload', () => { stopVoice(); stopTimer(); });
render(false);
</script>
